; preset-05-nitidez.ini
;
; Base: preset-02-grade-neutra (Kernel -> Feed -> Grade neutro, IMAGE_SPACE=1,
; VALIDATE_LUMA=1 / VALIDATE_DEPTH=0)
; + DLSS5_Sharpen entre o Feed e o Grade.
;
; ORDEM (e a unica correta; ver docs\nitidez.md e docs\cor-hdr-e-filtros.md §4):
;
;   Lumenite_Kernel   -> motion vectors
;   DLSS5_Feed        -> o add-on dispara DLSS + Neural Rendering AQUI
;   DLSS5_Sharpen     -> nitidez sobre a saida neural
;   DLSS5_Grade       -> cor por ultimo
;
; Nitidez ACIMA do Feed contamina o optical flow e entra no historico temporal
; do DLSS. Nitidez ABAIXO do Grade realca o banding da LUT e o grao que a
; S-curve amplificou. Por isso ela fica no meio.
;
; Parametros escolhidos (moderados, para fonte de captura 8 bits):
;   Sharpness   0.35  reforco visivel sem textura propria
;   HaloProtect 0.80  o pixel so pode ultrapassar os vizinhos em 20% do
;                     contraste local -- borda viva, sem contorno
;   Denoise     0.025 contraste local abaixo disso e grao de compressao,
;                     nao detalhe; suba para 0.04 se ceu/parede "fervilhar"
;
; Se a fonte for limpa (PC nativo, sem placa de captura), Denoise 0.010 e
; Sharpness 0.45 recuperam mais textura fina.

PreprocessorDefinitions=DLSS5_MV_PROVIDER=3,IMAGE_SPACE=1
Techniques=Lumenite_Kernel@lumenite_Kernel.fx,DLSS5_Feed@DLSS5_Feed.fx,DLSS5_Sharpen@DLSS5_Sharpen.fx,DLSS5_Grade@DLSS5_Grade.fx
TechniqueSorting=Lumenite_Kernel@lumenite_Kernel.fx,DLSS5_Feed@DLSS5_Feed.fx,DLSS5_Sharpen@DLSS5_Sharpen.fx,DLSS5_Grade@DLSS5_Grade.fx,DLSS5_Feed_Debug@DLSS5_Feed.fx,Lumenite_AnamorphicBloom@lumenite_AnamorphicBloom.fx,Lumenite_LSAO@lumenite_LSAO.fx,Lumenite_QuantAO@lumenite_QuantAO.fx,Lumenite_QuantMotion@lumenite_QuantMotion.fx,Lumenite_RTAO@lumenite_RTAO.fx,LUMENITE_SSSR@lumenite_SSSR.fx,Lumenite_TRAA@lumenite_TRAA.fx

[DLSS5_Feed.fx]
DEBUG_VIEW=0
DEPTH_TOLERANCE=0.100000
GEOM_AGREE_PX=1.500000
GEOM_DYNAMIC_MARGIN=0.250000
GEOM_ENABLE=0
GEOM_MASK_REJECTED=0.350000
GEOM_OUTLIER_PX=4.000000
GEOM_PARALLAX=0.020000
LUMA_TOLERANCE=0.250000
MASK_STRENGTH=1.000000
MV_CONSISTENCY=1.400000
MV_LOWRES_FILTER=0
MV_PROVIDER_INFO=0
MV_SCALE=1.000000
MV_SIGN=1.000000,1.000000
MV_VALIDATE=1
STATIC_BIAS=0.150000
STATIC_MIN_CONTRAST=0.012000
VALIDATE_DEPTH=0
VALIDATE_LUMA=1
VALIDATE_MV=1
VALIDATE_STATIC=1

[DLSS5_Sharpen.fx]
Sharpness=0.350000
HaloProtect=0.800000
Denoise=0.025000
DebugView=0

[DLSS5_Grade.fx]
Exposure=0.000000
Temperature=0.000000
Tint=0.000000
Lift=0.000000,0.000000,0.000000
Gamma=1.000000,1.000000,1.000000
Gain=1.000000,1.000000,1.000000
SCurve=0.100000
Contrast=1.000000
ContrastPivot=0.500000
Vibrance=0.100000
Saturation=0.000000
LUT_SELECT=0
LUT_Strength=1.000000
LUT_AmountLuma=1.000000
LUT_AmountChroma=1.000000
