; =====================================================================================
;  ofertas.ini - convite do PC do Fafa (janela com QR que aparece ao abrir o app)
;  Fica ao lado do DLSS5ForAll.exe. Salve sempre em UTF-8 (o Bloco de Notas mantém).
;  O app NUNCA reescreve este arquivo - pode editar à vontade que os comentários ficam.
;  Se ele não existir, o app usa os textos embutidos e não quebra.
; =====================================================================================
[ofertas]

; Destino do QR, do botão e do endereço mostrado na tela. É uma linha só pra mudar.
url=https://t.me/+Tg-va1EvXX1lYTJh

; Quando o convite abre sozinho ao iniciar o app:
;   sempre        = toda vez que o app abre (padrão)
;   primeira_vez  = só na primeira execução; depois nunca mais sozinho
;   0 / nao       = nunca abre sozinho (continua acessível pelo painel)
mostrar=0

; 1 reexibe o convite mesmo com a política acima fechada (para testar/suporte).
; Continua valendo enquanto estiver 1 - volte para 0 quando terminar o teste.
forcar_splash=0

; IGNORADO desde a versão sem contagem regressiva. A janela agora é como o aviso do
; WinRAR: aparece, fica na tela e só sai quando a pessoa fecha (Agora não, X, Esc, ou
; abrindo o link). A chave continua sendo aceita e descartada só para não quebrar quem
; já tinha o arquivo editado - pode apagar esta linha à vontade.
segundos=10

; ------------------------------------------------------------------ marca
; Nome que aparece no cabeçalho da janela (em texto, sem imagem).
marca=PC DO FAFA
submarca=PROMOÇÕES

; ------------------------------------------------------------------ texto em uso
; Hierarquia: título grande em caixa alta (o gancho) > mensagem (o motivo) >
; cta, que vira o selo com bordinha ciano (o que fazer) > botão.
; O título é posto em caixa alta pelo app - escreva normal aqui.
titulo=Peça de PC pelo menor preço
mensagem=A gente mostra onde comprar barato no Brasil e como importar pagando menos. O app é grátis - o grupo é como você retribui.
cta=Aponta a câmera no código ou clica no botão
botao=QUERO AS OFERTAS
botao_fechar=Agora não
rodape=aponte a câmera do celular
; O que aparece escrito embaixo do QR: o NOME do grupo (o endereço do convite não aparece
; em lugar nenhum da tela - o QR, o botão e a vitrine já levam até ele).
nome_grupo=PC do Fafa Promoções

; ------------------------------------------------------------------ ingles
; O app tem dois idiomas (Português / English, escolhido no seletor ou no painel).
; As chaves de TEXTO acima valem quando ele está em português; as mesmas chaves com o
; sufixo _en valem quando está em inglês. Sem a chave do idioma em uso, fica o texto
; embutido no app, que já está traduzido - ou seja, você não precisa preencher nada aqui.
; url, mostrar e forcar_splash não são texto e valem nos dois idiomas: sem sufixo.
;
; titulo_en=PC parts at the lowest price
; mensagem_en=We show you where to buy cheap in Brazil and how to import for less. The app is free - the group is how you pay it back.
; cta_en=Point your camera at the code, or click the button
; botao_en=SHOW ME THE DEALS
; botao_fechar_en=START THE PROGRAM
; rodape_en=point your phone camera here
; nome_grupo_en=PC do Fafa Promoções
; submarca_en=DEALS

; ------------------------------------------------------------------ outras versões
; Para trocar, comente as linhas titulo/mensagem/botao acima e descomente um bloco.
;
; -- curta e direta --
; titulo=Este app é de graça
; mensagem=Quem banca é o grupo PC do Fafa. Entra lá e vem oferta de peça de PC todo dia.
; botao=ENTRAR NO GRUPO
;
; -- prova social (166k+ é o número que o próprio site publica) --
; titulo=166 mil pessoas já estão no grupo
; mensagem=É lá que sai a oferta de peça antes de todo mundo, e a rota de importação que sai mais barata. O app é grátis; o grupo é como você retribui.
; cta=Grupo VIP com 166k+ membros ativos
; botao=ENTRAR AGORA
;
; Quebra de linha na mensagem: escreva \n onde quiser quebrar.
; Estado de "já mostrado" (usado só por mostrar=primeira_vez) fica no dlss5forall.ini,
; seção [ofertas], chave ja_mostrado - apague a linha de lá para ver o convite de novo.

; Canal do criador: o botão "APOIAR O CANAL" do launcher e do painel aponta SEMPRE para o
; endereço embutido no programa. A chave `canal=` NÃO é mais lida - qualquer valor aqui é
; ignorado (quem já tinha a linha no arquivo não quebra; pode apagá-la).

; =====================================================================================
;  [atualizacao] - o launcher da versão portable e a web (versão nova, publi, contagem)
;
;  url_base= liga tudo com uma chave só. Vazia (padrão) = o launcher NÃO faz nenhuma
;  requisição. Com ela, ao abrir, o launcher busca (em segundo plano, 3 s no máximo, só
;  https, sem cookies; a tela não espera):
;    {url_base}/versao.json   se há versão nova. Se houver, a pergunta "Nova versão
;                             disponível - Sim, atualizar / Agora não" (caixa padrão do
;                             Windows) aparece SÓ depois que a pessoa clica num botão de
;                             iniciar. Quem fecha sem escolher não vê pergunta.
;    {url_base}/ofertas.json  a publi desta tela (título, mensagem, botão, link, cupom).
;                             O último JSON válido fica em cache\ofertas.json ao lado do
;                             launcher, para a tela abrir com a última publi mesmo sem rede.
;    {url_base}/evento        um registro anônimo do botão clicado (ver contar=).
;    {url_base}/resumo        o relatório de uso (SÓ na cópia do autor; ver relatorio_token=).
;  Cada endereço pode ser sobrescrito: url_manifesto=, url_ofertas=, relatorio_url=.
;  Exceção só para TESTE: http://127.0.0.1:<porta>/... é aceito sem https (servidor local).
;
;  contar=1 (padrão): junto com as buscas vão QUATRO dados, e só eles: v (versão do
;  programa), m (nvidia/amd/sem: o botão escolhido na última abertura), l (pt/en) e id (um
;  número aleatório gerado na primeira abertura, guardado em [atualizacao] id_instalacao=
;  do dlss5forall.ini da raiz; não vem de hardware, nome, e-mail nem IP). Serve para o autor
;  saber quantas pessoas usam o programa e quais botões da tela do grupo são usados.
;  contar=0: nada disso é enviado, nenhum clique é registrado, e as buscas continuam
;  funcionando normalmente. O bloco PRIVACIDADE do LEIA-ME.txt explica o mesmo.
;
;  VITRINE (a coluna da esquerda da tela): a tela do launcher fica mais larga e ganha, à
;  esquerda, a página de ofertas de agora do grupo — rolável, com o botão de entrar no grupo.
;  Ela mora na landing do grupo, em https://grupo.pcdofafa.com.br/app-ofertas (não depende
;  de url_base, que continua só para versão/publi/contagem), e é mostrada pelo WebView2 (o
;  motor do Edge, que já vem no Windows 11 e na maioria dos Windows 10; a WebView2Loader.dll
;  ao lado do launcher é só a ponte até ele). A coluna só aparece quando dá para ela
;  aparecer: sem rede (o launcher espera no máximo 1,5 s pela resposta), sem o WebView2 na
;  máquina, ou num monitor estreito demais, a tela é a de sempre (uma coluna) e o
;  launcher.log diz o motivo. Os dados do motor ficam em cache\webview2\.
;  As chaves vitrine= e vitrine_url= NÃO são mais lidas: a coluna fica sempre ligada
;  (quando possível) e a página é sempre https://grupo.pcdofafa.com.br/app-ofertas. Valores
;  postos aqui são ignorados. Ao endereço o launcher acrescenta ?l=pt|en e, com contar=1,
;  o id (o mesmo das buscas; com contar=0 o id não vai).
;  Dentro da coluna só navega a própria página; qualquer link (lojas, entrar no grupo) abre
;  no navegador padrão.
;
;  Estado gravado pelo launcher (NÃO aqui - este arquivo nunca é reescrito pelo programa):
;  dlss5forall.ini da raiz, seção [atualizacao]: automatica=0/1 (a caixa "atualizar
;  automaticamente"), ultima_verificacao=, id_instalacao=, modulo=.
;
;  Para o AUTOR: publicar-versao.ps1 gera o versao.json e o zip; publicar-oferta.ps1 gera
;  o ofertas.json; os dois enviam ao servidor com -Publicar (token em DLSS5_TOKEN_ADMIN).
;  Na cópia do autor, relatorio_token=<token> faz aparecer o cartão "Relatório de uso" na
;  tela (e grava relatorio-uso.txt ao lado do launcher). O pacote distribuído NÃO leva essa
;  chave.
;  Produção (o worker fafa-dlss5-app do painel): url_base=https://pcdofafa.com.br/dlss5-app
[atualizacao]
url_base=https://pcdofafa.com.br/dlss5-app
contar=1
;url_manifesto=
;url_ofertas=
;relatorio_url=
;relatorio_token=
