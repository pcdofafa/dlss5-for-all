; =====================================================================================
;  ofertas.ini - convite do PC do Fafá (janela com QR que aparece ao abrir o app)
;  Fica ao lado do DLSS5ForAll.exe. Salve sempre em UTF-8 (o Bloco de Notas mantém).
;  O app NUNCA reescreve este arquivo - pode editar à vontade que os comentários ficam.
;  Se ele não existir, o app usa os textos embutidos e não quebra.
; =====================================================================================
[ofertas]

; Destino do QR, do botão e do endereço mostrado na tela. É uma linha só pra mudar.
url=https://grupo.pcdofafa.com.br/pg

; Quando o convite abre sozinho ao iniciar o app:
;   sempre        = toda vez que o app abre (padrão)
;   primeira_vez  = só na primeira execução; depois nunca mais sozinho
;   0 / nao       = nunca abre sozinho (continua acessível pelo painel)
mostrar=sempre

; 1 reexibe o convite mesmo com a política acima fechada (para testar/suporte).
; Continua valendo enquanto estiver 1 - volte para 0 quando terminar o teste.
forcar_splash=0

; IGNORADO desde a versão sem contagem regressiva. A janela agora é como o aviso do
; WinRAR: aparece, fica na tela e só sai quando a pessoa fecha (Agora não, X, Esc, ou
; abrindo o link). A chave continua sendo aceita e descartada só para não quebrar quem
; já tinha o arquivo editado - pode apagar esta linha à vontade.
segundos=10

; ------------------------------------------------------------------ marca
; Nome que aparece no cabeçalho da janela (em texto, sem imagem).
marca=PC DO FAFÁ
submarca=PROMOÇÕES

; ------------------------------------------------------------------ texto em uso
; Hierarquia: título grande em caixa alta (o gancho) > mensagem (o motivo) >
; cta, que vira o selo com bordinha ciano (o que fazer) > botão.
; O título é posto em caixa alta pelo app - escreva normal aqui.
titulo=Peça de PC pelo menor preço
mensagem=A gente mostra onde comprar barato no Brasil e como importar pagando menos. O app é grátis - o grupo é como você retribui.
cta=Aponta a câmera no código ou clica no botão
botao=QUERO AS OFERTAS
botao_fechar=Agora não
rodape=aponte a câmera do celular

; ------------------------------------------------------------------ ingles
; O app tem dois idiomas (Português / English, escolhido no seletor ou no painel).
; As chaves de TEXTO acima valem quando ele está em português; as mesmas chaves com o
; sufixo _en valem quando está em inglês. Sem a chave do idioma em uso, fica o texto
; embutido no app, que já está traduzido - ou seja, você não precisa preencher nada aqui.
; url, canal, mostrar e forcar_splash não são texto e valem nos dois idiomas: sem sufixo.
;
; titulo_en=PC parts at the lowest price
; mensagem_en=We show you where to buy cheap in Brazil and how to import for less. The app is free - the group is how you pay it back.
; cta_en=Point your camera at the code, or click the button
; botao_en=SHOW ME THE DEALS
; botao_fechar_en=START THE PROGRAM
; rodape_en=point your phone camera here
; submarca_en=DEALS

; ------------------------------------------------------------------ outras versões
; Para trocar, comente as linhas titulo/mensagem/botao acima e descomente um bloco.
;
; -- curta e direta --
; titulo=Este app é de graça
; mensagem=Quem banca é o grupo PC do Fafá. Entra lá e vem oferta de peça de PC todo dia.
; botao=ENTRAR NO GRUPO
;
; -- prova social (166k+ é o número que o próprio site publica) --
; titulo=166 mil pessoas já estão no grupo
; mensagem=É lá que sai a oferta de peça antes de todo mundo, e a rota de importação que sai mais barata. O app é grátis; o grupo é como você retribui.
; cta=Grupo VIP com 166k+ membros ativos
; botao=ENTRAR AGORA
;
; Quebra de linha na mensagem: escreva \n onde quiser quebrar.
; Estado de "já mostrado" (usado só por mostrar=primeira_vez) fica no dlss5forall.ini,
; seção [ofertas], chave ja_mostrado - apague a linha de lá para ver o convite de novo.

; Canal do criador. O launcher da abertura ganha um botão "APOIAR O CANAL" quando esta
; chave tem um endereço http(s); sem ela, o botão simplesmente não aparece — prometer um
; link que não existe é pior do que não ter o botão.
canal=https://www.youtube.com/@pcdofafa
