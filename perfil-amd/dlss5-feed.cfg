enabled=1
mode=2
hdr=-1
depth_inverted=-1
flags=-1
reset_every=0
warmup_rebuild=180
rebuild=0
log_frames=3
create_delay=60
preset=5
work_resolution=100
work_upscale=0
work_sharpness=0.30
gpu_timeout_ms=2000
buffer_home=1
async_home=0
sync_home=0
mv_scale_x=1.000
mv_scale_y=1.000
stall_log_ms=50
# --- chaves da 1.2 (o add-on do perfil AMD e o mesmo binario da producao) ----------
# nr_spike: 0 obrigatorio aqui. No perfil AMD quem roda a rede neural e o mod
# DLSS-NR-on-AMD, dentro do dispatch do FSR. Ligar o neural proprio do feed seria
# uma segunda rede sobre o mesmo quadro.
nr_spike=0
nr_passes=1
# hud_restore: recurso 1.2, precisa do DLSS5_HUD.fx (esta em reshade-shaders).
hud_restore=-1
hud_restore_strength=-1
# dred: breadcrumbs de GPU e captura de falha de pagina no device privado. Vale
# ainda mais aqui do que na NVIDIA: e o diagnostico de quando a placa do usuario
# faz algo que a nossa bancada nao faz.
dred=1
# --- modulo AMD (portador FSR 3.1 no lugar do NGX) --------------------------------
# amd_carrier: 1 forca o portador FSR; 0 desliga; -1 automatico pela placa.
# 1 e o valor COMPROVADO na RX 9060 XT em 11/09. Numa Radeon o -1 daria no mesmo,
# mas a configuracao que rodou usou 1 e nao ha motivo para mudar sem remedir.
amd_carrier=1
# amd_color_fmt: formato DXGI do buffer de cor entregue ao FSR/mod. 87 = B8G8R8A8_UNORM,
# o do nosso swapchain, sem conversao. Comprovado. Se o dlssnr_on_amd.log disser
# "unsupported colour format 87", troque para 10 (R16G16B16A16_FLOAT).
amd_color_fmt=87
# amd_decoy_swapchain: 1 e OBRIGATORIO, e esta e a correcao mais importante deste
# arquivo. Nossa janela e D3D11: com 0, o mod engancha DXGI e Present mas NUNCA arma
# o hook do FSR -- sem engine init, sem HIP, sem "network job", e a imagem sai como
# FSR puro, sem rede neural nenhuma. Com 1 o Feeder cria o swapchain-isca D3D12 e o
# mod adota o device certo. Comprovado na RX 9060 XT em 11/09.
amd_decoy_swapchain=1
# amd_srgb: -1 automatico (o portador decide se a cor vai linear ou sRGB); 0/1 forca.
amd_srgb=-1
