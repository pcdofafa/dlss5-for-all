; preset-04-brilho-contido.ini
;
; Base: preset-01-nucleo-afinado (Kernel -> Feed, IMAGE_SPACE=1, validacao ajustada)
; + DLSS5_Grade configurado para CONTER uma imagem clara/lavada.
;
; ATENCAO -- este preset e MAQUIAGEM, nao a correcao na raiz.
; A causa provavel do brilho esta em ReShade.ini [RenoDX.DLSS5]:
; NRIntensity / NRLocalTone / NRLocalStructure / NRSkinStructure estao em 2.0
; (o MAXIMO do slider; os padroes sao 1 / 1 / 1 / -1). Corrija la primeiro.
; Ver docs\brilho-witcher3.md.
;
; Use ESTE preset quando o brilho vier da CAPTURA (HDR do Windows ligado, o WGC
; entrega o tone-map SDR do compositor) -- ai nao ha slider de NR que resolva.
;
; Curva aplicada (espaco de exibicao, so na luma para o contraste):
;   0.15 -> 0.093   sombras recuperadas (o preto lavado volta a ser preto)
;   0.50 -> 0.467   meios-tons ~0.10 stop mais escuros
;   0.85 -> 0.874   altas levemente realcadas (devolve o "punch")
;   1.00 -> 1.000   branco intacto
;
; Se ficar escuro demais: Gamma 0.96 e SCurve 0.06.
; Se ainda estiver lavado: Gamma 0.88, Lift -0.014, Contrast 1.10.

PreprocessorDefinitions=DLSS5_MV_PROVIDER=3,IMAGE_SPACE=1
Techniques=Lumenite_Kernel@lumenite_Kernel.fx,DLSS5_Feed@DLSS5_Feed.fx,DLSS5_Grade@DLSS5_Grade.fx
TechniqueSorting=Lumenite_Kernel@lumenite_Kernel.fx,DLSS5_Feed@DLSS5_Feed.fx,DLSS5_Grade@DLSS5_Grade.fx,DLSS5_Feed_Debug@DLSS5_Feed.fx,Lumenite_AnamorphicBloom@lumenite_AnamorphicBloom.fx,Lumenite_LSAO@lumenite_LSAO.fx,Lumenite_QuantAO@lumenite_QuantAO.fx,Lumenite_QuantMotion@lumenite_QuantMotion.fx,Lumenite_RTAO@lumenite_RTAO.fx,LUMENITE_SSSR@lumenite_SSSR.fx,Lumenite_TRAA@lumenite_TRAA.fx

[DLSS5_Feed.fx]
DEBUG_VIEW=0
DEPTH_TOLERANCE=0.100000
GEOM_AGREE_PX=1.500000
GEOM_DYNAMIC_MARGIN=0.250000
GEOM_ENABLE=0
GEOM_MASK_REJECTED=0.350000
GEOM_OUTLIER_PX=4.000000
GEOM_PARALLAX=0.020000
LUMA_TOLERANCE=0.250000
MASK_STRENGTH=1.000000
MV_CONSISTENCY=1.400000
MV_LOWRES_FILTER=0
MV_PROVIDER_INFO=0
MV_SCALE=1.000000
MV_SIGN=1.000000,1.000000
MV_VALIDATE=1
STATIC_BIAS=0.150000
STATIC_MIN_CONTRAST=0.012000
VALIDATE_DEPTH=0
VALIDATE_LUMA=1
VALIDATE_MV=1
VALIDATE_STATIC=1

[DLSS5_Grade.fx]
Exposure=0.000000
Temperature=0.000000
Tint=0.000000
Lift=-0.008000,-0.008000,-0.008000
Gamma=0.920000,0.920000,0.920000
Gain=1.000000,1.000000,1.000000
SCurve=0.120000
Contrast=1.060000
ContrastPivot=0.420000
Vibrance=0.120000
Saturation=0.040000
LUT_SELECT=0
LUT_Strength=1.000000
LUT_AmountLuma=1.000000
LUT_AmountChroma=1.000000

[lumenite_AnamorphicBloom.fx]
BLOOM_INTENSITY=0.000000
BLOOM_SHARP=0
BLOOM_SKIP_SKYBOX=0
BLOOM_STRETCH=7.500000
BLOOM_THRESHOLD=0.700000
USER_GUIDE=0

[lumenite_TRAA.fx]
DEBUG_EDGES=0
EDGE_MODE=0
HFI_INTENSITY=0.010000
HISTORY_BLEND=1.000000
MAX_SHARP_DIFF=0.100000
SHARP_STRENGTH=1.000000
SHOW_STATUS=0
