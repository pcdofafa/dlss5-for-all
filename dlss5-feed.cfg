enabled=1
mode=2
hdr=-1
depth_inverted=-1
flags=-1
reset_every=0
warmup_rebuild=0
rebuild=0
log_frames=3
create_delay=59
preset=5
work_resolution=100
work_upscale=0
work_sharpness=0.45
gpu_timeout_ms=2000
buffer_home=1
async_home=0
sync_home=0
mv_scale_x=1.000
mv_scale_y=1.000
stall_log_ms=50
nr_spike=1
nr_passes=1
hud_restore=-1
hud_restore_strength=-1
# --- diagnostico e Neural Rendering proprio (1.3) ---------------------------------
# dred: breadcrumbs de GPU e captura de falha de pagina no device D3D12 privado. Um
# TDR passa a dizer ONDE morreu em vez de so devolver 0x887A0006.
dred=1
# As chaves abaixo so agem com nr_spike ligado, e ele nasce em 0: em producao quem faz
# a rede neural e o renodx-dlss.addon64. Ligar os dois ao mesmo tempo derruba o
# evaluate do SuperSampling, e por isso o feeder recusa esse arranjo e diz o motivo.
# Ver docs\pesquisa-2026-09-11\RELATORIO-MOTOR-PROPRIO.md.
# nr_reduzida: 1 poe a rede para rodar noutra resolucao (nr_escala) e recompoe o
# resultado por residuo. Abaixo de 100 economiza placa; acima NAO vale (medido).
nr_reduzida=0
nr_escala=65
nr_residual=100
# Perfil de imagem da rede no motor proprio. Mesmos nomes do [ultima] do
# dlss5forall.ini, para o painel copiar valor por valor sem tabela de traducao.
nr_estilo=0
nr_intensidade=1.000
nr_tom_local=1.000
nr_tom_global=1.000
nr_estrutura_local=1.000
nr_estrutura_pele=1.000
nr_mascara_auto=0
# --- modulo AMD ------------------------------------------------------------------
# O add-on instalado em bin\ e a variante AMD do Feeder (a mesma que o modulo usa), e
# ela grava estas quatro chaves sozinha no arranque. Elas ficam aqui porque a
# producao as tem: sem elas, um portable novo nasceria com o cfg diferente do que
# esta rodando. No caminho NVIDIA amd_carrier=-1 mantem o portador FSR desligado.
# Os valores PROPRIOS do modulo AMD (amd_carrier=1, amd_decoy_swapchain=1) moram em
# perfil-amd\dlss5-feed.cfg, que e quem manda em bin-amd\.
amd_carrier=-1
amd_color_fmt=87
amd_srgb=-1
amd_decoy_swapchain=0
